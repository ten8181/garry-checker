<body>
<header class="top">
  <div class="logo sticker">GARRY CHECK</div>
  <p class="sub">出演・掲載を逃さないぞ ※恋愛感情なし</p>
  <div class="progress sticker"><span id="progressText">0 / 0</span><div class="bar"><i id="progressBar"></i></div></div>
</header>
<nav class="tabs" id="tabs"></nav>
<label class="toggle"><input type="checkbox" id="onlyTodo"> 未完了だけ表示</label>
<main id="list" aria-label="出演情報"></main>
<footer class="foot">
  <p class="note"><span>進捗・メモはこのブラウザに保存</span><span class="updatedMeta" hidden> · 更新 <span id="updatedAt"></span></span></p>
  <div class="sourceLine"><p id="sourceStatus" role="status" aria-live="polite">出演情報を読み込み中…</p><button class="quietLink" id="refreshBtn">再読込</button></div>
  <details id="fetchDetails" class="fetchDetails" hidden><summary>エラーの詳細</summary><p id="fetchDetailText"></p></details>
  <nav class="utilityLinks" aria-label="設定とバックアップ">
    <button class="quietLink" id="settingsBtn">スプレッドシート設定</button>
    <button class="quietLink" id="backupBtn">進捗の書き出し / 読み込み</button>
  </nav>
</footer>
<dialog id="memoDlg" class="sticker">
  <form method="dialog">
    <h2 id="memoTitle"></h2>
    <textarea id="memoText" maxlength="500" rows="8" placeholder="感想やメモ"></textarea>
    <div class="count"><span id="memoCount">0</span> / 500</div>
    <div class="row"><button value="cancel" class="btn ghost">閉じる</button><button value="save" class="btn">保存</button></div>
  </form>
</dialog>
<dialog id="backupDlg" class="sticker">
  <h2>進捗のバックアップ</h2>
  <p class="help">機種変更やブラウザのデータ削除に備えて保存できます。読み込みは今の進捗とメモを上書きします。</p>
  <div class="backupActions">
    <button class="btn" id="exportBtn">バックアップを書き出す</button>
    <label class="btn ghost importLabel" for="importFile">バックアップを読み込む</label>
    <input type="file" id="importFile" accept="application/json" class="fileInput">
    <button class="quietLink" id="closeBackup">閉じる</button>
  </div>
</dialog>
<dialog id="settingsDlg" class="sticker">
  <form id="settingsForm">
    <h2>スプレッドシート設定</h2>
    <p class="help">公開用のシートだけを指定してください。「リンクを知っている全員：閲覧者」で共有したシートを読み込みます。設定はこのブラウザだけに保存されます。</p>
    <label for="sheetUrl">スプレッドシートURL</label>
    <input id="sheetUrl" type="url" required>
    <label for="sheetName">シート名</label>
    <input id="sheetName" type="text" placeholder="空欄なら先頭シート">
    <p id="settingsError" role="alert"></p>
    <div class="row"><button type="button" id="closeSettings" class="btn ghost">閉じる</button><button type="submit" class="btn" id="saveSettings">確認して保存</button></div>
  </form>
</dialog>
<p class="disclaimer">非公式のファン制作チェックリストです。掲載情報は公式発表をご確認ください。</p>
<div id="toast" class="toast sticker" hidden></div>

</body>
</html>
